name: flutter_endroits_favoris
description: Application de gestion d'endroits favoris avec caméra, Riverpod et Google Maps.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Génération d'identifiants uniques (UUID v4)
  uuid: ^4.0.0
  
  # Gestion d'état avec Riverpod v2
  flutter_riverpod: ^2.4.0
  
  # Accès à la caméra et à la galerie
  image_picker: ^1.0.0
  
  # Carte Google Maps pour Flutter
  google_maps_flutter: ^2.5.0
  
  # Accès au GPS (position de l'appareil)
  geolocator: ^10.0.0
  
  # Conversion coordonnées GPS → adresse lisible
  geocoding: ^2.1.0
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
